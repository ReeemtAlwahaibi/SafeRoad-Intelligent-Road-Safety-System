<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="diamond" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,7 L7,0 L14,7 L7,14 Z" fill="white" stroke="#333" stroke-width="1"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1F3864">SafeRoad+ - System Class Diagram</text>

  <!-- Driver -->
  <g>
    <rect x="560" y="70" width="280" height="190" rx="6" fill="#EAF1FB" stroke="#1F3864" stroke-width="1.5"/>
    <text x="700" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#1F3864">Driver</text>
    <line x1="560" y1="104" x2="840" y2="104" stroke="#1F3864"/>
    <text x="572" y="122" font-size="12" fill="#222">+ driverID: String</text>
    <text x="572" y="138" font-size="12" fill="#222">+ name: String</text>
    <text x="572" y="154" font-size="12" fill="#222">+ phone: String</text>
    <text x="572" y="170" font-size="12" fill="#222">+ vehicleInfo: String</text>
    <text x="572" y="186" font-size="12" fill="#222">+ location: String</text>
    <text x="572" y="202" font-size="12" fill="#222">+ isLoggedIn: Boolean</text>
    <line x1="560" y1="212" x2="840" y2="212" stroke="#1F3864"/>
    <text x="572" y="228" font-size="11.5" fill="#222">+ createAccount() | login()</text>
    <text x="572" y="243" font-size="11.5" fill="#222">+ sendSOSAlert() | reportAccident()</text>
    <text x="572" y="258" font-size="11.5" fill="#222">+ requestSafeRoute() | viewLiveMap()</text>
  </g>

  <!-- SafeRoadSystem -->
  <g>
    <rect x="510" y="330" width="380" height="210" rx="6" fill="#1F3864" stroke="#1F3864" stroke-width="1.5"/>
    <text x="700" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SafeRoadSystem</text>
    <line x1="510" y1="364" x2="890" y2="364" stroke="#ffffff"/>
    <text x="522" y="382" font-size="12" fill="#ffffff">+ systemID: String</text>
    <text x="522" y="398" font-size="12" fill="#ffffff">+ alertHistory: List&lt;SOSAlert&gt;</text>
    <text x="522" y="414" font-size="12" fill="#ffffff">+ routeDatabase: List&lt;Route&gt;</text>
    <line x1="510" y1="424" x2="890" y2="424" stroke="#ffffff"/>
    <text x="522" y="440" font-size="11" fill="#ffffff">+ validateUser(driverID)</text>
    <text x="522" y="455" font-size="11" fill="#ffffff">+ getDriverData(driverID)</text>
    <text x="522" y="470" font-size="11" fill="#ffffff">+ addVehicleLocation(vehicleInfo, gpsCoordinates)</text>
    <text x="522" y="485" font-size="11" fill="#ffffff">+ sendAlert(driverData, vehicleInfo, gpsCoordinates)</text>
    <text x="522" y="500" font-size="11" fill="#ffffff">+ confirmHelp(alertID, status)</text>
    <text x="522" y="515" font-size="11" fill="#ffffff">+ getSafeRoute(origin, destination)</text>
    <text x="522" y="530" font-size="11" fill="#ffffff">+ viewMapData()</text>
  </g>

  <!-- Driver -> SafeRoadSystem link -->
  <line x1="700" y1="260" x2="700" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#diamond)"/>
  <text x="686" y="300" font-size="11" fill="#333">1</text>
  <text x="686" y="322" font-size="11" fill="#333">1</text>

  <!-- Bottom row: 5 classes -->
  <!-- EmergencyAuthoritySystem -->
  <g>
    <rect x="30" y="640" width="230" height="150" rx="6" fill="#EAF1FB" stroke="#1F3864" stroke-width="1.5"/>
    <text x="145" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">EmergencyAuthoritySystem</text>
    <line x1="30" y1="672" x2="260" y2="672" stroke="#1F3864"/>
    <text x="40" y="688" font-size="10.5" fill="#222">+ authorityID: String</text>
    <text x="40" y="702" font-size="10.5" fill="#222">+ receivedAlerts: List&lt;SOSAlert&gt;</text>
    <line x1="30" y1="710" x2="260" y2="710" stroke="#1F3864"/>
    <text x="40" y="725" font-size="10" fill="#222">+ confirmHelp(alertID, status)</text>
    <text x="40" y="738" font-size="10" fill="#222">+ sendResponseStatus()</text>
    <text x="40" y="751" font-size="10" fill="#222">+ dispatchHelp(driverLocation)</text>
  </g>

  <!-- WeatherAPI -->
  <g>
    <rect x="290" y="640" width="220" height="150" rx="6" fill="#EAF1FB" stroke="#1F3864" stroke-width="1.5"/>
    <text x="400" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">WeatherAPI</text>
    <line x1="290" y1="672" x2="510" y2="672" stroke="#1F3864"/>
    <text x="300" y="688" font-size="10.5" fill="#222">+ apiKey: String</text>
    <text x="300" y="702" font-size="10.5" fill="#222">+ weatherData: String</text>
    <line x1="290" y1="710" x2="510" y2="710" stroke="#1F3864"/>
    <text x="300" y="725" font-size="10" fill="#222">+ provideHazardAlerts()</text>
    <text x="300" y="738" font-size="10" fill="#222">+ updateHazardAlerts()</text>
    <text x="300" y="751" font-size="10" fill="#222">+ getWeatherConditions(location)</text>
  </g>

  <!-- MapSystem -->
  <g>
    <rect x="540" y="640" width="220" height="150" rx="6" fill="#EAF1FB" stroke="#1F3864" stroke-width="1.5"/>
    <text x="650" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">MapSystem</text>
    <line x1="540" y1="672" x2="760" y2="672" stroke="#1F3864"/>
    <text x="550" y="688" font-size="10.5" fill="#222">+ liveTrafficData: String</text>
    <line x1="540" y1="696" x2="760" y2="696" stroke="#1F3864"/>
    <text x="550" y="711" font-size="10" fill="#222">+ getBaseMap() | getRealTimeData()</text>
    <text x="550" y="724" font-size="10" fill="#222">+ sendRoadSuggestions()</text>
    <text x="550" y="737" font-size="10" fill="#222">+ updateRoad() | overlayData()</text>
  </g>

  <!-- SOSAlert -->
  <g>
    <rect x="790" y="640" width="220" height="150" rx="6" fill="#EAF1FB" stroke="#1F3864" stroke-width="1.5"/>
    <text x="900" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">SOSAlert</text>
    <line x1="790" y1="672" x2="1010" y2="672" stroke="#1F3864"/>
    <text x="800" y="688" font-size="10.5" fill="#222">+ alertID: String</text>
    <text x="800" y="702" font-size="10.5" fill="#222">+ driverID, gpsCoordinates: String</text>
    <text x="800" y="716" font-size="10.5" fill="#222">+ status: String</text>
    <line x1="790" y1="724" x2="1010" y2="724" stroke="#1F3864"/>
    <text x="800" y="739" font-size="10" fill="#222">+ sendAlert() | displayHelpMessage()</text>
    <text x="800" y="752" font-size="10" fill="#222">+ displayDuplicateMessage()</text>
  </g>

  <!-- Route -->
  <g>
    <rect x="1040" y="640" width="220" height="150" rx="6" fill="#EAF1FB" stroke="#1F3864" stroke-width="1.5"/>
    <text x="1150" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="#1F3864">Route</text>
    <line x1="1040" y1="672" x2="1260" y2="672" stroke="#1F3864"/>
    <text x="1050" y="688" font-size="10.5" fill="#222">+ routeID, startPoint, endPoint: String</text>
    <text x="1050" y="702" font-size="10.5" fill="#222">+ riskLevel: String</text>
    <text x="1050" y="716" font-size="10.5" fill="#222">+ distance: Double</text>
    <line x1="1040" y1="724" x2="1260" y2="724" stroke="#1F3864"/>
    <text x="1050" y="739" font-size="10" fill="#222">+ calculateSafeRoute()</text>
    <text x="1050" y="752" font-size="10" fill="#222">+ updateRouteStatus()</text>
  </g>

  <!-- connectors from SafeRoadSystem to each bottom class -->
  <line x1="600" y1="540" x2="150" y2="640" stroke="#333" stroke-width="1.3"/>
  <text x="580" y="562" font-size="11" fill="#333">1</text>
  <text x="165" y="628" font-size="11" fill="#333">1</text>

  <line x1="640" y1="540" x2="400" y2="640" stroke="#333" stroke-width="1.3"/>
  <text x="630" y="562" font-size="11" fill="#333">1</text>
  <text x="410" y="628" font-size="11" fill="#333">1</text>

  <line x1="680" y1="540" x2="650" y2="640" stroke="#333" stroke-width="1.3"/>
  <text x="665" y="562" font-size="11" fill="#333">1</text>
  <text x="655" y="628" font-size="11" fill="#333">1</text>

  <line x1="750" y1="540" x2="900" y2="640" stroke="#333" stroke-width="1.3"/>
  <text x="748" y="562" font-size="11" fill="#333">1</text>
  <text x="890" y="628" font-size="11" fill="#333">*</text>

  <line x1="820" y1="540" x2="1150" y2="640" stroke="#333" stroke-width="1.3"/>
  <text x="805" y="562" font-size="11" fill="#333">1</text>
  <text x="1140" y="628" font-size="11" fill="#333">*</text>

  <text x="700" y="870" text-anchor="middle" font-size="11" fill="#888">SafeRoad+ | Software Engineering Term Project</text>
</svg>
